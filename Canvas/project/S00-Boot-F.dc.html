<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boot · F · Two frames, three pillars</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:wght@600;700&amp;family=Courier+Prime:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#D9573B}a:hover{color:#DDF7F5}
@keyframes bootLine{0%{transform:scaleX(0);opacity:1}4%{transform:scaleX(1);opacity:1}8%{transform:scaleX(1);opacity:0}100%{transform:scaleX(1);opacity:0}}
@keyframes bootOpen{0%,4%{clip-path:inset(50% 0 50% 0);opacity:1}10%{clip-path:inset(0 0 0 0);opacity:1}57%{clip-path:inset(0 0 0 0);opacity:1}67%,100%{clip-path:inset(0 0 0 0);opacity:0}}
@keyframes bar1{0%,10%{transform:scaleY(0)}18%,100%{transform:scaleY(1)}}
@keyframes bar2{0%,14%{transform:scaleY(0)}22%,100%{transform:scaleY(1)}}
@keyframes bar3{0%,18%{transform:scaleY(0)}26%,100%{transform:scaleY(1)}}
@keyframes plateIn{0%,6%{opacity:0}10%,100%{opacity:1}}
@keyframes wordIn{0%,24%{opacity:0;letter-spacing:26px}34%,100%{opacity:1;letter-spacing:12px}}
@keyframes lineIn{0%,30%{opacity:0}32%{opacity:.6}33%{opacity:.15}36%,100%{opacity:1}}
.glow{text-shadow:0 0 1px rgba(217,87,59,0.9),0 0 8px rgba(217,87,59,0.5),0 0 20px rgba(217,87,59,0.22)}
</style>
</helmet>
<div style="width: 400px; height: 640px; position: relative; overflow: hidden; background: #1A1D1A; color: #C8C3B0; font-family: 'Courier Prime', 'Courier New', monospace">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 319px; height: 2px; background: #DDF7F5; box-shadow: 0 0 12px #DDF7F5; transform-origin: center; animation: bootLine {{dur}}s linear infinite"></div>
<div style="position: absolute; inset: 0; animation: bootOpen {{dur}}s linear infinite">
<div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(rgba(217,87,59,0.14) 1px, transparent 1.4px); background-size: 9px 9px; opacity: 0.7"></div>
<div style="position: relative; height: 100%; box-sizing: border-box; padding: 0 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px">
<div role="img" aria-label="Auburn mark: three dark pillars inside two ember frames, marked H, C, M" style="width: 208px; height: 208px; box-sizing: border-box; background: #D9573B; padding: 14px; border: 1px solid #121215; box-shadow: 0 0 22px rgba(217,87,59,0.3); animation: plateIn {{dur}}s linear infinite">
<div style="height: 100%; box-sizing: border-box; border: 2px solid #121215; background: #D9573B; padding: 14px">
<div style="height: 100%; box-sizing: border-box; border: 2px solid #121215; background: #D9573B; display: flex; flex-direction: column">
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px">
<span style="display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; background: #121215; transform-origin: bottom; animation: bar1 {{dur}}s ease-out infinite; font-family: Gelasio, Georgia, serif; font-size: 24px; font-weight: 600; color: #D9573B">H</span><span style="display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; background: #121215; transform-origin: bottom; animation: bar2 {{dur}}s ease-out infinite; font-family: Gelasio, Georgia, serif; font-size: 24px; font-weight: 600; color: #D9573B">C</span><span style="display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; background: #121215; transform-origin: bottom; animation: bar3 {{dur}}s ease-out infinite; font-family: Gelasio, Georgia, serif; font-size: 24px; font-weight: 600; color: #D9573B">M</span>
</div>
<div style="height: 15px; margin-top: 3px; display: flex; align-items: center; justify-content: center; background: #D9573B; border-top: 1px solid #121215; font-size: 7.5px; font-weight: 700; letter-spacing: 1.2px; color: #121215">HYPERTROPHY · CARDIO · MOBILITY</div>
</div>
</div>
</div>
<h1 class="glow" style="margin: 0; font-family: Gelasio, Georgia, serif; font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: 12px; padding-left: 12px; color: #D9573B; animation: wordIn {{dur}}s ease-out infinite">AUBURN</h1>
<p style="margin: 0; max-width: 300px; min-height: 36px; text-align: center; font-size: 12.5px; line-height: 1.4; letter-spacing: 1px; text-transform: uppercase; color: #C8C3B0; animation: lineIn {{dur}}s linear infinite">{{line}}</p>
</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.26) 0px, rgba(0,0,0,0.26) 1px, transparent 1px, transparent 3px); opacity: 0.7"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;duration&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:11.5,&quot;min&quot;:2,&quot;max&quot;:12,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Animation&quot;},&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:640}}">
class Component extends DCLogic {
constructor(props) {
super(props);
this.lines = ['More human than human.', 'Building Better Worlds.', 'Introducing, the new You.'];
this.state = { i: Math.floor(Math.random() * this.lines.length) };
}
duration() {
return this.props.duration ?? 6;
}
componentDidMount() {
this.schedule();
}
componentWillUnmount() {
clearTimeout(this.timer);
}
// A new line each loop, never the same twice running; the wait follows the duration tweak.
schedule() {
var self = this;
this.timer = setTimeout(function () {
var n = self.lines.length;
var next = (self.state.i + 1 + Math.floor(Math.random() * (n - 1))) % n;
self.setState({ i: next });
self.schedule();
}, this.duration() * 1000);
}
renderVals() {
return { line: this.lines[this.state.i], dur: this.duration() };
}
}
</script>
</body>
</html>
