<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boot · dark · agreed</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="basics.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:wght@700&amp;family=Saira:wght@300;600&amp;display=swap">
<style>
body{margin:0}
/* The phone's browser may enlarge text on a page it thinks is not built for it; the boards show text at its own size. */
html, body{-webkit-text-size-adjust:100%; text-size-adjust:100%}
.b00{ --dot-size: 9px; --wordmark-width: 220px; }
.b00-light { --wordmark-width: 200px; }
.b00-screen { width: 400px; height: 640px; position: relative; overflow: hidden; background: var(--boot-color-ground); }
.b00-power-line { position: absolute; left: 0; right: 0; top: 319px; height: 2px; background: var(--color-apart);  }
.b00-picture { position: absolute; inset: 0;  }
.b00-dots { position: absolute; inset: 0; background-image: radial-gradient(var(--boot-color-dot) 1px, transparent 1.4px); background-size: var(--dot-size) var(--dot-size); opacity: 0.7; }
.b00-stack { position: relative; height: 100%; box-sizing: border-box; padding: 0 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.b00-plate { width: 220px; height: 264px; box-sizing: border-box; background: var(--color-accent); padding: 10px;  }
.b00-rule-outer { height: 100%; box-sizing: border-box; border: 2px solid var(--color-ink); padding: 4px; }
.b00-rule-inner { height: 100%; box-sizing: border-box; border: 1px solid var(--color-ink); padding: 12px 14px 10px; display: flex; flex-direction: column; }
.b00-pillars { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.b00-pillar { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; background: var(--color-ink); transform-origin: bottom; font-family: var(--font-mark); font-weight: 300; font-size: 28px; line-height: 1; color: var(--color-accent); }
.b00-pillar:nth-child(1) {  }
.b00-pillar:nth-child(2) {  }
.b00-pillar:nth-child(3) {  }
.b00-line { height: 26px; margin-top: 10px; border-top: 1px solid var(--color-ink); display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; font-family: var(--font-mark); font-weight: 600; font-size: 8px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--color-ink); }
.b00-line span {  }
.b00-wordmark { margin: 0; width: var(--wordmark-width); display: flex; justify-content: space-between; font-family: var(--font-wordmark); font-weight: 700; font-size: 34px; line-height: 1; color: var(--boot-color-wordmark);  }
.b00-still * {  }
.auburn-entry { display: contents; }
.auburn-header { display: contents; }
@keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
.auburn-hold { display: block; }
.auburn-hold .hold-letter[data-state="idle"] { color: color-mix(in srgb, var(--hold-color-text) var(--primary-text), transparent); }
.auburn-hold .hold-letter[data-state="filled"] { color: var(--hold-color-text-filled); }
.auburn-list { display: block; }
.auburn-widget { display: contents; }
.auburn-widget[data-width="full"] .w-half, .auburn-widget[data-width="half"] .w-full { display: none !important; }
.auburn-widget .cover { display: none; }
.auburn-widget[data-kind="rest"] .cover-rest, .auburn-widget[data-kind="goals"] .cover-goals, .auburn-widget[data-kind="cardio"] .cover-cardio { display: block; }
.auburn-widget .widget { border: 3px solid color-mix(in srgb, var(--color-accent) var(--supporting-line), transparent); }
.auburn-widget[data-state="editing"] .widget { border: 2px solid color-mix(in srgb, var(--color-accent) var(--primary-line), transparent); }
.auburn-widget[data-state="stepped-back"] .widget { opacity: var(--widget-stepped-back); }
.auburn-widget:not([data-state="editing"]) .edit-done, .auburn-widget[data-state="editing"] .edit-idle, .auburn-widget:not([data-state="editing"]) .edit-controls { display: none !important; }
.auburn-widget .seg { background: transparent; color: color-mix(in srgb, var(--color-accent) var(--secondary-text), transparent); }
.auburn-widget[data-width="half"] .seg-half, .auburn-widget[data-width="full"] .seg-full { background: var(--color-accent); color: var(--color-ink); }
.bust{background: var(--color-accent); -webkit-mask: url(/_blob/8dc69cd32a565ee54c5606a82fce2b14) center top / contain no-repeat; mask: url(/_blob/8dc69cd32a565ee54c5606a82fce2b14) center top / contain no-repeat}
a{color:inherit}
.sc-host:has(> .auburn-entry), .sc-host:has(> .auburn-header), .sc-host:has(> .auburn-widget) { display: contents; }
.sc-host:has(> .auburn-hold), .sc-host > .auburn-hold, .sc-host:has(> .auburn-list), .sc-host > .auburn-list { height: 100%; }
#dc-root > .sc-host:has(> [class^="auburn-"]) { background: var(--color-ground); color: var(--color-accent); font-family: var(--font-interface); overflow: hidden; }
#dc-root > .sc-host:has(> .round-3) { --text-1: 11px; --text-1-tracking: 0.5px; --text-1-leading: 15px; --text-2: 13px; --text-2-tracking: 2px; --text-2-leading: 11px; --text-3: 16px; --text-3-tracking: 1.5px; --text-3-leading: 20px; --text-4: 22px; --text-4-tracking: 6px; --text-4-leading: 24px; --color-primary-text: var(--ember); --color-secondary-text: var(--ember); --color-supporting-text: var(--ember); --space-1: 2px; --space-2: 4px; --space-3: 8px; --space-4: 12px; --space-5: 16px; --space-6: 24px; --tap-area: 48px }
</style>
</helmet>
<div class="b00 b00-dark b00-screen" data-theme="dark" style="{{theme}}">
  
  <div class="b00-picture">
    <div class="b00-dots" aria-hidden="true"></div>
    <div class="b00-stack">
      <div class="b00-plate" role="img" aria-label="Auburn mark: three pillars lettered H, C, M, with the line beneath">
        <div class="b00-rule-outer"><div class="b00-rule-inner">
          <div class="b00-pillars"><span class="b00-pillar">H</span><span class="b00-pillar">C</span><span class="b00-pillar">M</span></div>
          <div class="b00-line"><span>More human than human.</span></div>
        </div></div>
      </div>
      <h1 class="b00-wordmark" aria-label="Auburn"><span>A</span><span>U</span><span>B</span><span>U</span><span>R</span><span>N</span></h1>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":null},"$preview":{"width":400,"height":640}}'>
class Component extends DCLogic {
renderVals() {
// Values passed in by the Theme board; on its own, the board's trials over basics.css.
return { theme: this.props.theme != null ? this.props.theme : "" };
}
}
</script>
</body>
</html>
