<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:wght@700&amp;family=Courier+Prime:wght@400;700&amp;display=swap">
<style>
body{margin:0}
/* The phone's browser may enlarge text on a page it thinks is not built for it; the boards show text at its own size. */
html, body{-webkit-text-size-adjust:100%; text-size-adjust:100%}

.auburn-entry { display: contents; }
.auburn-header { display: contents; }
@keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
.auburn-hold { display: block; }
.auburn-hold .hold-letter[data-state="idle"] { color: color-mix(in srgb, var(--hold-color-text) var(--primary-text), transparent); }
.auburn-hold .hold-letter[data-state="filled"] { color: var(--hold-color-text-filled); }
.auburn-list { display: block; }
.auburn-widget { display: contents; }
.auburn-widget[data-width="full"] .w-half, .auburn-widget[data-width="half"] .w-full { display: none !important; }
.auburn-widget .cover { display: none; }
.auburn-widget[data-kind="rest"] .cover-rest, .auburn-widget[data-kind="goals"] .cover-goals, .auburn-widget[data-kind="cardio"] .cover-cardio { display: block; }
.auburn-widget .widget { border: 3px solid color-mix(in srgb, var(--color-accent) var(--supporting-line), transparent); }
.auburn-widget[data-state="editing"] .widget { border: 2px solid color-mix(in srgb, var(--color-accent) var(--primary-line), transparent); }
.auburn-widget[data-state="stepped-back"] .widget { opacity: var(--widget-stepped-back); }
.auburn-widget:not([data-state="editing"]) .edit-done, .auburn-widget[data-state="editing"] .edit-idle, .auburn-widget:not([data-state="editing"]) .edit-controls { display: none !important; }
.auburn-widget .seg { background: transparent; color: color-mix(in srgb, var(--color-accent) var(--secondary-text), transparent); }
.auburn-widget[data-width="half"] .seg-half, .auburn-widget[data-width="full"] .seg-full { background: var(--color-accent); color: var(--color-ink); }
.auburn-entry.round-3 { display: contents; }
.auburn-header.round-3 { display: contents; }
@keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
.auburn-hold.round-3 { display: block; }
.auburn-hold.round-3 .hold-letter[data-state="idle"] { color: var(--part-label-color, color-mix(in srgb, var(--hold-color-text) var(--primary-text), transparent)); }
.auburn-hold.round-3 .hold-letter[data-state="filled"] { color: var(--hold-color-text-filled); }
.auburn-list.round-3 { display: block; }
.auburn-widget.round-3 { display: contents; }
.auburn-widget.round-3[data-width="full"] .w-half, .auburn-widget.round-3[data-width="half"] .w-full { display: none !important; }
.auburn-widget.round-3 .cover { display: none; }
.auburn-widget.round-3[data-kind="rest"] .cover-rest, .auburn-widget.round-3[data-kind="goals"] .cover-goals, .auburn-widget.round-3[data-kind="cardio"] .cover-cardio { display: block; }
.auburn-widget.round-3 .widget { border: var(--supporting-line-width) solid color-mix(in srgb, var(--color-accent) var(--supporting-line), transparent); }
.bust{background: var(--color-accent); -webkit-mask: url(/_blob/8dc69cd32a565ee54c5606a82fce2b14) center top / contain no-repeat; mask: url(/_blob/8dc69cd32a565ee54c5606a82fce2b14) center top / contain no-repeat}
a{color:inherit}
.sc-host:has(> .auburn-entry), .sc-host:has(> .auburn-header), .sc-host:has(> .auburn-widget) { display: contents; }
.sc-host:has(> .auburn-hold), .sc-host > .auburn-hold, .sc-host:has(> .auburn-list), .sc-host > .auburn-list { height: 100%; }
#dc-root > .sc-host:has(> [class^="auburn-"]) { background: var(--color-ground); color: var(--color-accent); font-family: var(--font-interface); overflow: hidden; }
#dc-root > .sc-host:has(> .round-3) { --text-1: 11px; --text-1-tracking: 0.5px; --text-1-leading: 15px; --text-2: 13px; --text-2-tracking: 2px; --text-2-leading: 11px; --text-3: 16px; --text-3-tracking: 1.5px; --text-3-leading: 20px; --text-4: 22px; --text-4-tracking: 6px; --text-4-leading: 24px; --color-primary-text: var(--ember); --color-supporting-text: var(--ember); --space-1: 2px; --space-2: 4px; --space-3: 8px; --space-4: 12px; --space-5: 16px; --space-6: 24px; --tap-area: 48px }
</style>
</helmet>
<div style="width: 400px; height: 640px; position: relative; overflow: hidden; background: var(--color-ground); color: var(--color-accent); font-family: var(--font-interface); {{theme}}">
<div style="position: absolute; left: 16px; right: 16px; top: 18px; display: flex; flex-direction: column; gap: 10px">
<dc-import name="C-Header" status="LAST WORKOUT · 2 DAYS AGO · CITY GYM" hint-size="100%,40px"></dc-import>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
<dc-import name="C-Widget" kind="rest" width="full" state="idle" title="REST AT A GLANCE" line1="4 IN TRAIN · 2 OVERDUE" line2="OVERDUE · QUADS, HAMSTRINGS" hint-size="100%,40px"></dc-import>
<dc-import name="C-Widget" kind="goals" width="half" state="idle" title="GOALS" line1="5 GOALS" line2="LATEST · PISTOL SQUAT" hint-size="100%,40px"></dc-import>
<dc-import name="C-Widget" kind="cardio" width="half" state="idle" title="CARDIO" line1="3 DAYS SINCE LAST" line2="LAST RUN · 8.2 KM" hint-size="100%,40px"></dc-import>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; top: 432px; bottom: 52px"><dc-import name="C-List" position="down" handle="3 MORE" entries="START WORKOUT|PAST WORKOUTS|EXERCISES" hint-size="100%,40px"></dc-import></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0"><dc-import name="C-Hold" label="POWER DOWN" fill="0" inverted="0" hint-size="100%,40px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":null},"$preview":{"width":400,"height":640}}'>
class Component extends DCLogic {
renderVals() {
// Values passed in by the Theme board; on its own, the board's trials over basics.css.
return { theme: this.props.theme != null ? this.props.theme : "" };
}
}
</script>
</body>
</html>
