<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=400">
<title>Auburn · Screen 01 · Navigation</title>
<!-- Approved board for screen 01, Navigation: round 2 from the design canvas, all five states.
     Layout reference only. The values come from ../basics.css and the parts from ../components.js; this file places them. The tube's
     effects are not drawn here; the app's shader adds them. The cursor blinks; nothing else moves. -->
<meta name="images" content="home: | #home > div; raised: | #raised > div; workout: | #workout > div; editing: | #editing > div; power-down: | #power-down > div">
<link rel="stylesheet" href="../basics.css">
<script src="../components.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:wght@700&family=Courier+Prime:wght@400;700&display=swap">
<style>
body { margin: 0; padding: 24px; background: #000; display: flex; flex-wrap: wrap; gap: 40px; font-family: var(--font-interface); }
h2 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #8A8A8A; text-transform: uppercase; }
a { color: inherit; }
</style>
</head>
<body>
<section class="state" id="home">
<h2>Home</h2>
<div style="width: 400px; height: 640px; position: relative; overflow: hidden; background: var(--color-ground); color: var(--color-accent); font-family: var(--font-interface); ">
<div style="position: absolute; left: 16px; right: 16px; top: 18px; display: flex; flex-direction: column; gap: 10px">
<auburn-header data-status="LAST WORKOUT · 2 DAYS AGO · CITY GYM"></auburn-header>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
<auburn-widget data-kind="rest" data-width="full" data-state="idle" data-title="REST AT A GLANCE" data-line1="4 IN TRAIN · 2 OVERDUE" data-line2="OVERDUE · QUADS, HAMSTRINGS"></auburn-widget>
<auburn-widget data-kind="goals" data-width="half" data-state="idle" data-title="GOALS" data-line1="5 GOALS" data-line2="LATEST · PISTOL SQUAT"></auburn-widget>
<auburn-widget data-kind="cardio" data-width="half" data-state="idle" data-title="CARDIO" data-line1="3 DAYS SINCE LAST" data-line2="LAST RUN · 8.2 KM"></auburn-widget>
</div>
</div>
<auburn-list data-position="down" data-handle="3 MORE" data-entries="START WORKOUT|PAST WORKOUTS|EXERCISES" style="position: absolute; left: 0; right: 0; top: 432px; bottom: 52px"></auburn-list>
<auburn-hold data-label="POWER DOWN" data-fill="0" data-inverted="0" style="position: absolute; left: 0; right: 0; bottom: 0"></auburn-hold>
</div>
</section>
<section class="state" id="raised">
<h2>List raised</h2>
<div style="width: 400px; height: 640px; position: relative; overflow: hidden; background: var(--color-ground); color: var(--color-accent); font-family: var(--font-interface); ">
<div style="position: absolute; left: 16px; right: 16px; top: 18px; display: flex; flex-direction: column; gap: 10px">
<auburn-header data-status="LAST WORKOUT · 2 DAYS AGO · CITY GYM"></auburn-header>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
<auburn-widget data-kind="rest" data-width="full" data-state="idle" data-title="REST AT A GLANCE" data-line1="4 IN TRAIN · 2 OVERDUE" data-line2="OVERDUE · QUADS, HAMSTRINGS"></auburn-widget>
<auburn-widget data-kind="goals" data-width="half" data-state="idle" data-title="GOALS" data-line1="5 GOALS" data-line2="LATEST · PISTOL SQUAT"></auburn-widget>
<auburn-widget data-kind="cardio" data-width="half" data-state="idle" data-title="CARDIO" data-line1="3 DAYS SINCE LAST" data-line2="LAST RUN · 8.2 KM"></auburn-widget>
</div>
</div>
<auburn-list data-position="raised" data-handle="HIDE" data-entries="START WORKOUT|PAST WORKOUTS|EXERCISES|SPLITS AND GYMS|OVERDUE LOG|SETTINGS" style="position: absolute; left: 0; right: 0; top: 82px; bottom: 52px"></auburn-list>
<auburn-hold data-label="POWER DOWN" data-fill="0" data-inverted="0" style="position: absolute; left: 0; right: 0; bottom: 0"></auburn-hold>
</div>
</section>
<section class="state" id="workout">
<h2>Workout in progress</h2>
<div style="width: 400px; height: 640px; position: relative; overflow: hidden; background: var(--color-ground); color: var(--color-accent); font-family: var(--font-interface); ">
<div style="position: absolute; left: 16px; right: 16px; top: 18px; display: flex; flex-direction: column; gap: 10px">
<auburn-header data-status="LAST WORKOUT · 2 DAYS AGO · CITY GYM"></auburn-header>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
<auburn-widget data-kind="rest" data-width="full" data-state="idle" data-title="REST AT A GLANCE" data-line1="4 IN TRAIN · 2 OVERDUE" data-line2="OVERDUE · QUADS, HAMSTRINGS"></auburn-widget>
<auburn-widget data-kind="goals" data-width="half" data-state="idle" data-title="GOALS" data-line1="5 GOALS" data-line2="LATEST · PISTOL SQUAT"></auburn-widget>
<auburn-widget data-kind="cardio" data-width="half" data-state="idle" data-title="CARDIO" data-line1="3 DAYS SINCE LAST" data-line2="LAST RUN · 8.2 KM"></auburn-widget>
</div>
</div>
<auburn-list data-position="down" data-handle="3 MORE" data-entries="RESUME WORKOUT|PAST WORKOUTS|EXERCISES" style="position: absolute; left: 0; right: 0; top: 432px; bottom: 52px"></auburn-list>
<auburn-hold data-label="POWER DOWN" data-fill="0" data-inverted="0" style="position: absolute; left: 0; right: 0; bottom: 0"></auburn-hold>
</div>
</section>
<section class="state" id="editing">
<h2>Editing a widget</h2>
<div style="width: 400px; height: 640px; position: relative; overflow: hidden; background: var(--color-ground); color: var(--color-accent); font-family: var(--font-interface); ">
<div style="position: absolute; left: 16px; right: 16px; top: 18px; display: flex; flex-direction: column; gap: 10px">
<auburn-header data-status="LAST WORKOUT · 2 DAYS AGO · CITY GYM"></auburn-header>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
<auburn-widget data-kind="rest" data-width="full" data-state="stepped-back" data-title="REST AT A GLANCE" data-line1="4 IN TRAIN · 2 OVERDUE" data-line2="OVERDUE · QUADS, HAMSTRINGS"></auburn-widget>
<auburn-widget data-kind="goals" data-width="half" data-state="editing" data-title="GOALS" data-line1="5 GOALS" data-line2="LATEST · PISTOL SQUAT"></auburn-widget>
<auburn-widget data-kind="cardio" data-width="half" data-state="stepped-back" data-title="CARDIO" data-line1="3 DAYS SINCE LAST" data-line2="LAST RUN · 8.2 KM"></auburn-widget>
</div>
</div>
<auburn-list data-position="down" data-handle="3 MORE" data-entries="START WORKOUT|PAST WORKOUTS|EXERCISES" style="position: absolute; left: 0; right: 0; top: 432px; bottom: 52px"></auburn-list>
<auburn-hold data-label="POWER DOWN" data-fill="0" data-inverted="0" style="position: absolute; left: 0; right: 0; bottom: 0"></auburn-hold>
</div>
</section>
<section class="state" id="power-down">
<h2>Power down, held</h2>
<div style="width: 400px; height: 640px; position: relative; overflow: hidden; background: var(--color-ground); color: var(--color-accent); font-family: var(--font-interface); ">
<div style="position: absolute; left: 16px; right: 16px; top: 18px; display: flex; flex-direction: column; gap: 10px">
<auburn-header data-status="LAST WORKOUT · 2 DAYS AGO · CITY GYM"></auburn-header>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
<auburn-widget data-kind="rest" data-width="full" data-state="idle" data-title="REST AT A GLANCE" data-line1="4 IN TRAIN · 2 OVERDUE" data-line2="OVERDUE · QUADS, HAMSTRINGS"></auburn-widget>
<auburn-widget data-kind="goals" data-width="half" data-state="idle" data-title="GOALS" data-line1="5 GOALS" data-line2="LATEST · PISTOL SQUAT"></auburn-widget>
<auburn-widget data-kind="cardio" data-width="half" data-state="idle" data-title="CARDIO" data-line1="3 DAYS SINCE LAST" data-line2="LAST RUN · 8.2 KM"></auburn-widget>
</div>
</div>
<auburn-list data-position="down" data-handle="3 MORE" data-entries="START WORKOUT|PAST WORKOUTS|EXERCISES" style="position: absolute; left: 0; right: 0; top: 432px; bottom: 52px"></auburn-list>
<auburn-hold data-label="POWER DOWN" data-fill="60" data-inverted="10" style="position: absolute; left: 0; right: 0; bottom: 0"></auburn-hold>
</div>
</section>
</body>
</html>
