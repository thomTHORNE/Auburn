name: auburn_gym_week
description: "Lab prototype: a week in the gym. Throwaway code."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  file_picker: ^10.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Saira
      fonts:
        - asset: fonts/Saira-Regular.ttf
        - asset: fonts/Saira-Bold.ttf
          weight: 700
    - family: Gelasio
      fonts:
        - asset: fonts/Gelasio.ttf
          weight: 700
