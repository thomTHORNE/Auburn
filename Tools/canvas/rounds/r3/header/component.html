<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=400">
<title>Auburn · Component · Header</title>
<!-- The header's round 3 copy, on the type and spacing scales, with its gaps from Visual Design's spacing table.
     Approving round 3 makes this the agreed component.html. -->
<meta name="images" content="header: | #header > .frame">
<link rel="stylesheet" href="../../basics.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:wght@700&family=Courier+Prime:wght@400;700&display=swap">
<script src="../../components.js"></script>
<style>
body { margin: 0; padding: 24px; background: #000; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; font-family: var(--font-interface); }
h2 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #8A8A8A; text-transform: uppercase; }
.frame { position: relative; background: var(--color-ground); color: var(--color-accent); font-family: var(--font-interface); }
</style>
</head>
<body>
<template id="auburn-header" data-props="" data-text="status">
<style>
.auburn-header { display: contents; }
@keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
</style>
<div style="display: flex; flex-direction: column; gap: var(--space-4)">
<div style="display: flex; align-items: center; font-family: var(--font-wordmark); font-weight: 700; font-size: var(--text-4); color: var(--color-accent); letter-spacing: var(--text-4-tracking); line-height: var(--text-4-leading)">AUBURN<span aria-hidden="true" style="display: inline-block; width: 11px; height: 20px; margin-left: var(--space-1); background: var(--color-accent); animation: blink var(--duration-cursor-blink) steps(1) infinite"></span></div>
<div style="font-size: var(--text-1); font-weight: var(--secondary-text-weight); color: color-mix(in srgb, var(--color-secondary-text) var(--secondary-text), transparent); letter-spacing: var(--text-1-tracking); line-height: var(--text-1-leading)">{{status}}</div>
</div>
</template>
<section id="header">
<h2>Header</h2>
<div class="frame" style="width: 368px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px"><auburn-header data-status="LAST WORKOUT · 2 DAYS AGO · CITY GYM"></auburn-header></div>
</section>
</body>
</html>
